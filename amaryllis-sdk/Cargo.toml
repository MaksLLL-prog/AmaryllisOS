[package]
name = "amaryllis-sdk"
version = "0.1.0"
edition = "2021"
description = "Bare-metal no_std Rust SDK for building preemptive Ring 3 ELF64 programs for AmaryllisOS"
license = "MIT"

[lib]
name = "amaryllis_sdk"
path = "src/lib.rs"

[[example]]
name = "hello"
path = "examples/hello.rs"

[[example]]
name = "multitask_counter"
path = "examples/multitask_counter.rs"

[[example]]
name = "gui_plasma"
path = "examples/gui_plasma.rs"

[[example]]
name = "net_http_client"
path = "examples/net_http_client.rs"

[[example]]
name = "fs_alloc_demo"
path = "examples/fs_alloc_demo.rs"

[[example]]
name = "ipc_shm_gui"
path = "examples/ipc_shm_gui.rs"

[profile.dev]
opt-level = 2
panic = "abort"

[profile.release]
opt-level = 3
panic = "abort"
lto = true
strip = "debuginfo"
