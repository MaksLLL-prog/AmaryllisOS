[package]
name = "amaryllis-sdk"
version = "0.1.0"
edition = "2021"
authors = ["kensei"]
license = "Apache-2.0"
description = "Bare-metal no_std Rust SDK for building Ring 3 ELF64 applications for Amaryllis OS"

[lib]
name = "amaryllis_sdk"
path = "src/lib.rs"

[[example]]
name = "hello"
path = "examples/hello.rs"

[[example]]
name = "multitask_counter"
path = "examples/multitask_counter.rs"

[[example]]
name = "gui_plasma"
path = "examples/gui_plasma.rs"

[[example]]
name = "net_http_client"
path = "examples/net_http_client.rs"

[[example]]
name = "fs_alloc_demo"
path = "examples/fs_alloc_demo.rs"

[[example]]
name = "ipc_shm_gui"
path = "examples/ipc_shm_gui.rs"

[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "code-model=small",
    "-C", "link-arg=-z",
    "-C", "link-arg=max-page-size=0x1000",
]
