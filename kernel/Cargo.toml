[package]
name = "kernel"
version = "0.11.0"
edition = "2021"
authors = ["MaksLLL-prog"]
description = "ANU (Amaryllis is Not Unix) — 64-bit hybrid micro/monolithic OS kernel in #![no_std] Rust"
repository = "https://github.com"
license = "Apache-2.0"

[dependencies]
bootloader_api = "0.11.17"
font8x8 = { version = "0.3", default-features = false, features = ["unicode"] }
x86_64 = "0.15.2"
lazy_static = { version = "1.5", features = ["spin_no_std"] }
spin = "0.9"
fontdue = { version = "0.9", default-features = false, features = ["hashbrown"] }
