[package]
name = "amaryllis_os"
version = "0.11.0"
edition = "2021"
authors = ["MaksLLL-prog"]
description = "Amaryllis OS — 64-bit hybrid operating system powered by the ANU kernel and 120 FPS Amaryllis Desktop"
repository = "https://github.com/MaksLLL-prog/AmaryllisOS"
license = "Apache-2.0"

[workspace]
resolver = "3"
members = ["kernel"]

[build-dependencies]
bootloader = "0.11.17"
kernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }

[profile.dev]
opt-level = 3
panic = "abort"

[profile.release]
opt-level = 3
codegen-units = 1
panic = "abort"
