[package]
name = "amaryllis_os"
version = "0.1.0"
edition = "2021"

[workspace]
resolver = "3"
members = ["kernel"]

[build-dependencies]
bootloader = "0.11.17"
kernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }

[profile.dev]
opt-level = 3
panic = "abort"

[profile.release]
opt-level = 3
panic = "abort"